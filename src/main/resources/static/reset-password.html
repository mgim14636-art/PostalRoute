<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="center-page">
    <div class="auth-shell">
      <div class="page-header">
          <button type="button" class="back-button" onclick="history.back()" aria-label="뒤로가기">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          </button>
          <h1>비밀번호 변경</h1>
      </div>
      <div class="panel">
        <form class="form-stack">
          <div class="password-field">
            <input type="password" id="password" name="password" placeholder="비밀번호">
            <button type="button" class="eye-button" onclick="togglePassword('password')">👁</button>
          </div>
          <p class="field-error" id="passwordError">9자 이상으로 작성해주세요.</p>
          <div class="password-field">
            <input type="password" id="password_recheck" name="password_recheck" placeholder="비밀번호 재확인">
            <button type="button" class="eye-button" onclick="togglePassword('password_recheck')">👁</button>
          </div>
          <button type="submit" class="btn-primary btn-block">비밀번호 재설정</button>
        </form>
      </div>
    </div>

    <div class="modal-overlay" id="resetPwModal">
      <div class="modal-box">
        <h3>알림</h3>
        <p>비밀번호 변경이 완료되었습니다.</p>
        <button type="button" id="resetPwConfirmBtn" class="btn-primary">확인</button>
      </div>
    </div>

    <script>
      // 비밀번호를 입력하는 동안, 9자가 안 되면 아래에 안내 문구를 보여주는 부분
      document.getElementById('password').addEventListener('input', function() {
          const passwordError = document.getElementById('passwordError');
          if (this.value.length > 0 && this.value.length < 9) {
              passwordError.classList.add('show');
          } else {
              passwordError.classList.remove('show');
          }
      });

      document.querySelector('form').addEventListener('submit', function(event) {
      event.preventDefault();

      const password = document.getElementById('password').value;
      const passwordRecheck = document.getElementById('password_recheck').value;

      const name = sessionStorage.getItem('resetName');
      const username = sessionStorage.getItem('resetUsername');
      const phoneNumber = sessionStorage.getItem('resetPhoneNumber');

      if (password.length < 9) {
      document.getElementById('passwordError').classList.add('show');
      return;
      }

      if (password !== passwordRecheck) {
      alert('비밀번호가 일치하지 않습니다.');
      return;
      }

      fetch('/api/find-pw', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, username: username, password: password, phoneNumber: phoneNumber })
      })
      .then(response => response.json())
      .then(data => {
      console.log('비밀번호 변경 완료:', data);
      document.getElementById('resetPwModal').classList.add('show');
      });
    });

    // 확인 버튼을 누르면 팝업을 닫고 로그인 화면으로 이동
    document.getElementById('resetPwConfirmBtn').addEventListener('click', function() {
      window.location.href = 'login.html';
    });

    function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
    }
    </script>
</body>
</html>
